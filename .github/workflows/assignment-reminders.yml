name: Create assignment reminders

on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment-reminders
  cancel-in-progress: false

jobs:
  create-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
      DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository secrets
        run: |
          for name in DATABASE_URL DJANGO_SECRET_KEY DJANGO_ALLOWED_HOSTS DJANGO_CORS_ALLOWED_ORIGINS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Create in-app assignment reminders
        run: python manage.py create_assignment_reminders
